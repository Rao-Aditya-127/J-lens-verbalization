<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>J-lens introspection viewer</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e0e0e3;
    --text: #1c1c1f;
    --muted: #6b6b73;
    --accent: #2f6fed;
    --match: #1a8a4a;
    --match-bg: #e5f6ec;
    --miss-bg: #f1f1f3;
    --bad: #c0392b;
    --chip-bg: #eef1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2025;
      --border: #303239;
      --text: #e7e7ea;
      --muted: #9a9aa2;
      --accent: #6c9bff;
      --match: #57d18a;
      --match-bg: #123321;
      --miss-bg: #26272c;
      --bad: #ff6b5e;
      --chip-bg: #2a2c33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #dropzone {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  #dropzone.drag { border-color: var(--accent); color: var(--accent); }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  main { padding: 16px 18px 40px; max-width: 1200px; margin: 0 auto; }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  #summary table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #summary th, #summary td { text-align: right; padding: 4px 8px; }
  #summary th:first-child, #summary td:first-child { text-align: left; }
  #summary thead th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  #filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #filters label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  select, input[type=text] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  input[type=text] { flex: 1; min-width: 180px; }
  table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rows th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    position: sticky;
    top: 84px;
    background: var(--panel);
  }
  table.rows td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.row-summary { cursor: pointer; }
  tr.row-summary:hover { background: var(--miss-bg); }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    background: var(--chip-bg);
    color: var(--muted);
    white-space: nowrap;
  }
  .cond-zero_shot { color: #b8860b; }
  .cond-few_shot_icl { color: var(--match); }
  .cond-text_only_control { color: var(--accent); }
  .overlap-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
  .valid-bad { color: var(--bad); font-weight: 600; }
  .detail td { background: var(--bg); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .detail-grid .full { grid-column: 1 / -1; }
  .block-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .text-box {
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip-bg);
    font-size: 12px;
  }
  .chip.match { background: var(--match-bg); color: var(--match); font-weight: 600; }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>J-lens introspection viewer</h1>
  <div id="dropzone">
    <span>Drop <code>collected_introspection.jsonl</code> here, or</span>
    <input type="file" id="fileInput" accept=".jsonl,.json,.txt">
    <span id="status">no file loaded</span>
  </div>
</header>

<main>
  <section class="panel" id="summaryPanel" style="display:none">
    <div id="summary"></div>
  </section>

  <section class="panel" id="filtersPanel" style="display:none">
    <div id="filters">
      <span><label for="conditionFilter">Condition</label>
        <select id="conditionFilter">
          <option value="">All</option>
          <option value="zero_shot">zero_shot</option>
          <option value="few_shot_icl">few_shot_icl</option>
          <option value="text_only_control">text_only_control</option>
        </select>
      </span>
      <span><label for="sourceFilter">Source</label>
        <select id="sourceFilter"><option value="">All</option></select>
      </span>
      <span><label for="validFilter">Parsing</label>
        <select id="validFilter">
          <option value="">All</option>
          <option value="bad">Fewer than 10 concepts parsed</option>
        </select>
      </span>
      <input type="text" id="searchBox" placeholder="Search example_id / question / answer…">
      <span><label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="overlap_desc">Overlap@10 (high → low)</option>
          <option value="overlap_asc">Overlap@10 (low → high)</option>
          <option value="id">Example ID</option>
          <option value="condition">Condition</option>
        </select>
      </span>
    </div>
  </section>

  <section class="panel" id="tablePanel" style="display:none">
    <table class="rows">
      <thead>
        <tr>
          <th></th>
          <th>example_id</th>
          <th>source</th>
          <th>condition</th>
          <th>overlap@10</th>
          <th>valid</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>

  <div id="empty">Load a <code>collected_introspection.jsonl</code> file to begin.</div>
</main>

<script>
let rows = [];
let expanded = new Set();

function normalize(token) {
  return (token || "").toString().trim().toLowerCase();
}

function sourceOf(exampleId) {
  if (exampleId.startsWith("gsm8k")) return "gsm8k";
  if (exampleId.startsWith("bbh")) return "bbh";
  if (exampleId.startsWith("truthfulqa")) return "truthfulqa";
  if (exampleId.startsWith("arc_challenge")) return "arc";
  if (exampleId.startsWith("hotpotqa")) return "hotpotqa";
  return "other";
}

function computeMetrics(row) {
  const target = new Set((row.j_lens_top10 || []).map(item => normalize(item.concept)));
  const predicted = new Set((row.predicted_top10 || []).map(normalize));
  let hit = 0;
  predicted.forEach(t => { if (target.has(t)) hit += 1; });
  const overlap10 = hit / 10;
  const precision = predicted.size ? hit / predicted.size : 0;
  const recall = target.size ? hit / target.size : 0;
  const f1 = (precision + recall) > 0 ? (2 * precision * recall) / (precision + recall) : 0;
  return { hit, target, predicted, overlap10, precision, recall, f1 };
}

function parseJSONL(text) {
  const parsed = [];
  let badLines = 0;
  text.split("\n").forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) return;
    try {
      parsed.push(JSON.parse(trimmed));
    } catch (e) {
      badLines += 1;
    }
  });
  return { parsed, badLines };
}

function loadText(text, label) {
  const { parsed, badLines } = parseJSONL(text);
  rows = parsed;
  expanded = new Set();
  document.getElementById("status").textContent =
    `${label}: ${rows.length} rows` + (badLines ? `, ${badLines} unparsable lines skipped` : "");

  const sourceFilter = document.getElementById("sourceFilter");
  const sources = Array.from(new Set(rows.map(r => sourceOf(r.example_id || "")))).sort();
  sourceFilter.innerHTML = '<option value="">All</option>' +
    sources.map(s => `<option value="${s}">${s}</option>`).join("");

  document.getElementById("summaryPanel").style.display = rows.length ? "" : "none";
  document.getElementById("filtersPanel").style.display = rows.length ? "" : "none";
  document.getElementById("tablePanel").style.display = rows.length ? "" : "none";
  document.getElementById("empty").style.display = rows.length ? "none" : "";
  render();
}

function currentFilters() {
  return {
    condition: document.getElementById("conditionFilter").value,
    source: document.getElementById("sourceFilter").value,
    validOnly: document.getElementById("validFilter").value,
    search: document.getElementById("searchBox").value.trim().toLowerCase(),
    sortBy: document.getElementById("sortBy").value,
  };
}

function applyFilters(list, f) {
  return list.filter(row => {
    if (f.condition && row.introspection_condition !== f.condition) return false;
    if (f.source && sourceOf(row.example_id || "") !== f.source) return false;
    if (f.validOnly === "bad" && (row.predicted_valid_count ?? 10) >= 10) return false;
    if (f.search) {
      const hay = `${row.example_id || ""} ${row.question || ""} ${row.answer || ""}`.toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function renderSummary(filtered) {
  const conditions = ["zero_shot", "few_shot_icl", "text_only_control"];
  const lines = conditions.map(cond => {
    const subset = filtered.filter(r => r.introspection_condition === cond);
    if (!subset.length) return null;
    const metrics = subset.map(computeMetrics);
    const avg = key => (metrics.reduce((sum, m) => sum + m[key], 0) / metrics.length);
    const under10 = subset.filter(r => (r.predicted_valid_count ?? 10) < 10).length;
    return { cond, n: subset.length, overlap10: avg("overlap10"), precision: avg("precision"),
              recall: avg("recall"), f1: avg("f1"), under10 };
  }).filter(Boolean);

  if (!lines.length) {
    document.getElementById("summary").innerHTML = "<em>No rows match the current filters.</em>";
    return;
  }
  const rowsHtml = lines.map(l => `
    <tr>
      <td class="cond-${l.cond}">${l.cond}</td>
      <td>${l.n}</td>
      <td>${l.overlap10.toFixed(3)}</td>
      <td>${l.precision.toFixed(3)}</td>
      <td>${l.recall.toFixed(3)}</td>
      <td>${l.f1.toFixed(3)}</td>
      <td>${l.under10}</td>
    </tr>`).join("");
  document.getElementById("summary").innerHTML = `
    <table>
      <thead><tr><th>condition</th><th>n</th><th>overlap@10</th><th>precision</th><th>recall</th><th>f1</th><th>valid&lt;10</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

function chip(text, isMatch) {
  return `<span class="chip${isMatch ? " match" : ""}">${escapeHtml(text)}</span>`;
}

function escapeHtml(s) {
  return (s || "").toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderDetailRow(row, metrics) {
  const jLensChips = (row.j_lens_top10 || [])
    .map(item => chip(`${item.concept} (${item.count})`, metrics.predicted.has(normalize(item.concept))))
    .join("");
  const predictedChips = (row.predicted_top10 || [])
    .map(token => chip(token, metrics.target.has(normalize(token))))
    .join("");
  const demoIds = row.generation_config && row.generation_config.demo_prompt_ids;

  return `
    <div class="detail-grid">
      <div class="full">
        <div class="block-label">Question</div>
        <div class="text-box">${escapeHtml(row.question)}</div>
      </div>
      <div class="full">
        <div class="block-label">Answer</div>
        <div class="text-box">${escapeHtml(row.answer)}</div>
      </div>
      <div>
        <div class="block-label">J-lens top10 (target)</div>
        <div class="chips">${jLensChips || "<em>none</em>"}</div>
      </div>
      <div>
        <div class="block-label">Predicted top10 (${row.predicted_valid_count ?? "?"} parsed)</div>
        <div class="chips">${predictedChips || "<em>none</em>"}</div>
      </div>
      ${row.predicted_explanation ? `
      <div class="full">
        <div class="block-label">Model's explanation</div>
        <div class="text-box">${escapeHtml(row.predicted_explanation)}</div>
      </div>` : ""}
      <div class="full">
        <details class="raw">
          <summary>Raw introspection response${demoIds ? ` &middot; demos: ${demoIds.join(", ")}` : ""}</summary>
          <div class="text-box">${escapeHtml(row.raw_introspection_response)}</div>
        </details>
      </div>
    </div>`;
}

function render() {
  const f = currentFilters();
  let filtered = applyFilters(rows, f);
  const metricsByIndex = filtered.map(computeMetrics);

  const order = filtered.map((row, i) => ({ row, m: metricsByIndex[i] }));
  if (f.sortBy === "overlap_desc") order.sort((a, b) => b.m.overlap10 - a.m.overlap10);
  else if (f.sortBy === "overlap_asc") order.sort((a, b) => a.m.overlap10 - b.m.overlap10);
  else if (f.sortBy === "id") order.sort((a, b) => (a.row.example_id || "").localeCompare(b.row.example_id || ""));
  else if (f.sortBy === "condition") order.sort((a, b) => (a.row.introspection_condition || "").localeCompare(b.row.introspection_condition || ""));

  renderSummary(filtered);

  const body = document.getElementById("tableBody");
  body.innerHTML = "";
  order.forEach(({ row, m }, i) => {
    const key = `${row.example_id}__${row.introspection_condition}__${i}`;
    const validBad = (row.predicted_valid_count ?? 10) < 10;
    const tr = document.createElement("tr");
    tr.className = "row-summary";
    tr.innerHTML = `
      <td>${expanded.has(key) ? "&#9662;" : "&#9656;"}</td>
      <td>${escapeHtml(row.example_id)}</td>
      <td><span class="badge">${sourceOf(row.example_id || "")}</span></td>
      <td class="cond-${row.introspection_condition}">${row.introspection_condition}</td>
      <td class="overlap-cell">${m.overlap10.toFixed(2)}</td>
      <td class="${validBad ? "valid-bad" : ""}">${row.predicted_valid_count ?? "?"}/10</td>
    `;
    tr.addEventListener("click", () => {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      render();
    });
    body.appendChild(tr);

    if (expanded.has(key)) {
      const detailTr = document.createElement("tr");
      detailTr.className = "detail";
      const td = document.createElement("td");
      td.colSpan = 6;
      td.innerHTML = renderDetailRow(row, m);
      detailTr.appendChild(td);
      body.appendChild(detailTr);
    }
  });
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  file.text().then(text => loadText(text, file.name));
});

["conditionFilter", "sourceFilter", "validFilter", "sortBy"].forEach(id =>
  document.getElementById(id).addEventListener("change", render));
document.getElementById("searchBox").addEventListener("input", render);

const dropzone = document.getElementById("dropzone");
["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", (e) => {
  const file = e.dataTransfer.files[0];
  if (!file) return;
  file.text().then(text => loadText(text, file.name));
});
</script>
</body>
</html>
